# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'

set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g status-justify centre
unbind C-r
bind C-r source-file ~/.tmux.conf

## Titles
set -g set-titles on

# wm window title string (uses statusbar variables)
set -g set-titles-string "tmux.#I.#W"

# rebind pane tiling
bind C-v split-window -h
bind C-h split-window

# colors
set -g base-index 1

set -g status-style fg=cyan

set-window-option -g window-status-current-style fg=cyan,bright

# command/message line colors
set -g message-style fg=white,bg=black,bright

# listen to alerts from all windows
set -g bell-action any

set-window-option -g clock-mode-colour green #green

bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Status bar
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=green][#S] #[fg=yellow][#H]'
set -g status-right '#[fg=magenta][#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null)] #[fg=cyan][ #(pmset -g batt 2>/dev/null | grep -oE "[0-9]+%%")] #[fg=cyan,bright][%a %Y-%m-%d %H:%M]'
set -g status-interval 15

# Resize panes using Alt + Shift + Arrow
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Down resize-pane -D 5
setw -g mouse on

# Default windows for the "main" session (only on first creation, not reload/SSH reattach)
if-shell '! tmux has-session -t main 2>/dev/null' \
  'new-session -d -s main -c "$HOME" -n home ; \
   new-window -t main -c "$HOME/github/goes" -n goes ; \
   new-window -t main -c "$HOME/github/skalas" -n skalas ; \
   select-window -t main:home'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
